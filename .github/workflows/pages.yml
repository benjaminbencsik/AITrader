name: Website
# Publishes the app as a website at https://<you>.github.io/<repo>/ (free). One-time: repo Settings -> Pages -> Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ['public/**', 'scripts/build-static.js', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/build-static.js --out dist
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deploy
        uses: actions/deploy-pages@v4
