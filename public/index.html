<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>AI Trader</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --text:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --accent:#2563eb; --good:#15803d; --bad:#b91c1c; --warn:#b45309; --pill:#e2e8f0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1220; --card:#131c2e; --text:#e5e9f0; --muted:#94a3b8; --line:#243049;
    --accent:#60a5fa; --good:#4ade80; --bad:#f87171; --warn:#fbbf24; --pill:#243049;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1220; --card:#131c2e; --text:#e5e9f0; --muted:#94a3b8; --line:#243049;
  --accent:#60a5fa; --good:#4ade80; --bad:#f87171; --warn:#fbbf24; --pill:#243049;
  color-scheme:dark;
}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:980px;margin:0 auto;padding:12px 16px 48px}
h1{font-size:18px;margin:0}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 8px}
header{padding:8px 0 0}
.top{display:flex;align-items:center;gap:8px}
.top h1{flex:1}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--pill);font-size:12px;font-weight:600}
.pill.live{background:var(--bad);color:#fff}
.pill.paper{background:var(--accent);color:#fff}
.pill.signals{background:var(--warn);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.card .k{color:var(--muted);font-size:12px}
.card .v{font-size:22px;font-weight:700;margin-top:2px}
.good{color:var(--good)} .bad{color:var(--bad)} .muted{color:var(--muted)}
button,select,input{font:inherit;color:var(--text)}
button{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:0 16px;font-weight:600;cursor:pointer;min-height:44px;line-height:1.2}
button.sm{min-height:36px;padding:0 12px;font-size:13px}
button.sec{background:var(--pill);color:var(--text)}
button.danger{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
button.block{width:100%}
button:disabled{opacity:.5;cursor:default}
input,select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-height:42px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.actions{display:grid;gap:8px;margin-top:12px}
.actions.cols{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.seg{display:flex;background:var(--pill);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;background:transparent;color:var(--text);min-height:38px;border-radius:9px;padding:0 8px;font-size:14px}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.18)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px}
.scroll{overflow-x:auto}
.empty{color:var(--muted);padding:10px 2px}
.banner{border-radius:10px;padding:10px 12px;margin:8px 0;font-size:13px;background:var(--pill)}
.banner.warn{background:color-mix(in srgb,var(--warn) 18%,var(--card));border:1px solid var(--warn)}
.banner.err{background:color-mix(in srgb,var(--bad) 15%,var(--card));border:1px solid var(--bad)}
details{margin-top:10px}
summary{cursor:pointer;color:var(--muted);font-weight:600}
.login{max-width:360px;margin:12vh auto;padding:0 16px}
.log{font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;max-height:260px;overflow:auto}
.log div{padding:2px 0;border-bottom:1px dashed var(--line)}
.hidden{display:none!important}
h3{font-size:15px;margin:0 0 6px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin:10px 0 8px;background:var(--pill);border-radius:12px;padding:3px}
.tabs button{background:transparent;color:var(--muted);padding:0 2px;border-radius:9px;min-height:38px;font-size:13px;white-space:nowrap}
.tabs button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.chart{width:100%;height:auto;display:block}
.chart .axis{stroke:var(--line);stroke-width:1}
.chart .lbl{fill:var(--muted);font-size:11px}
.chart .l-eq{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round}
.chart .l-spy{fill:none;stroke:var(--muted);stroke-width:2;stroke-dasharray:5 4}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:13px;margin-top:6px}
.legend .sw{display:inline-block;width:18px;height:0;border-top:3px solid var(--accent);margin-right:6px}
.legend .sw.spy{border-top:3px dashed var(--muted)}
.secret{font:600 15px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;word-break:break-all;background:var(--pill);border-radius:8px;padding:10px;margin:8px 0}
.idea{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between;border-top:1px solid var(--line);padding:8px 0;margin-top:6px}
.idea>div:first-child{flex:1 1 200px}
.sect{margin-top:12px}
.sect>h3{font-size:16px;margin:0 0 2px}
.hint{color:var(--muted);font-size:13px;margin:2px 0 8px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.fields .full{grid-column:1/-1}
.switch{display:flex;gap:14px;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line);color:var(--text);font-size:15px;margin:0;cursor:pointer}
.switch:first-of-type{border-top:0}
.sw-text{display:flex;flex-direction:column;gap:2px;min-width:0}
.sw-title{font-weight:600}
.sw-desc{color:var(--muted);font-size:12.5px;line-height:1.35}
.sw-ctl{position:relative;flex:none;width:46px;height:28px}
.sw-ctl input{position:absolute;inset:0;opacity:0;width:100%;height:100%;min-height:0;margin:0;cursor:pointer}
.sw-track{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background .15s}
.sw-track::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.35);transition:transform .15s}
.sw-ctl input:checked+.sw-track{background:var(--accent)}
.sw-ctl input:checked+.sw-track::after{transform:translateX(18px)}
.sw-ctl input:disabled+.sw-track{opacity:.5}
.sw-ctl input:focus-visible+.sw-track{outline:2px solid var(--accent);outline-offset:2px}
.sect details{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.savebar{position:sticky;bottom:0;margin:14px -16px 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line);z-index:5}
.pill.warn{background:var(--warn);color:#fff}
</style>
</head>
<body>
<div id="app"></div>
<script src="./app.js"></script>
</body>
</html>
